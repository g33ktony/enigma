name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web · cifrado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test.js index.html

  mobile:
    name: App · pruebas, tipos y lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: mobile/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
