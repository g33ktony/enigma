<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@800&family=IBM+Plex+Sans:wght@400&display=block" rel="stylesheet">
<style>
  /* Captura de tienda de iPhone 6.9": 1320×2868. Título arriba y la pantalla real dentro de un marco. */
  html, body { margin: 0; width: 1320px; height: 2868px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #3a2416 0%, #1d120b 55%, #0e0f10 100%);
    color: #ece2c9; font-family: 'IBM Plex Sans', sans-serif; position: relative;
  }
  h1 { font-family: 'Big Shoulders Stencil Display', Impact, sans-serif; font-weight: 800; color: #c79f55;
       font-size: 150px; line-height: .98; letter-spacing: 3px; text-align: center; margin: 0; padding: 150px 80px 0; }
  p { font-size: 52px; line-height: 1.3; text-align: center; margin: 36px 130px 0; opacity: .85; }
  .phone { position: absolute; left: 160px; width: 1000px; top: 690px; height: 2173px; border-radius: 120px;
           overflow: hidden; box-shadow: 0 0 0 18px #0b0b0c, 0 0 0 22px #c79f55, 0 60px 140px rgba(0,0,0,.6); }
  .phone img { width: 100%; display: block; }
</style>
</head>
<body>
  <h1 id="t"></h1>
  <p id="s"></p>
  <div class="phone"><img id="img"></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('t').innerHTML = q.get('title');
  document.getElementById('s').textContent = q.get('sub');
  document.getElementById('img').src = q.get('img');
</script>
</body>
</html>
